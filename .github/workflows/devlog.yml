name: Update DEVLOG

on:
  push:
    branches: [main]
    paths-ignore:
      - 'DEVLOG.md'
  schedule:
    - cron: '0 10 * * *'  # 18:00 台灣時間（UTC+8）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update DEVLOG on push
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python .github/scripts/update_devlog.py push

      - name: Update DEVLOG daily summary
        if: github.event_name == 'schedule'
        run: python .github/scripts/update_devlog.py daily

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVLOG.md
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "docs: auto-update DEVLOG [skip ci]"
          git push
